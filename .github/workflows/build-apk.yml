name: Build Android APK (MIBEM QHSE)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Lire le numéro de version
        id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Injecter le numéro de version dans l'application
        run: sed -i "s/__APP_VERSION__/${{ steps.version.outputs.value }}/g" www/index.html

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dépendances npm
        run: npm install

      - name: Installer le JDK 21 (nécessaire pour Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accepter les licences du SDK Android déjà présent sur la machine
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        continue-on-error: true

      - name: Aligner le numéro de version native Android (versionName / versionCode)
        run: |
          sed -i "s/versionName \"1.0\"/versionName \"${{ steps.version.outputs.value }}\"/" android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Synchroniser le projet Capacitor (copie www/ vers android/)
        run: |
          npx cap sync android > sync.log 2>&1 || { echo "::error::$(tr '\n' ' ' < sync.log | cut -c1-1200)"; exit 1; }
          cat sync.log

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Préparer la signature release (si les secrets sont configurés)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.MIBEM_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mibem-release.jks"
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            echo "✅ Secrets de signature trouvés — l'APK release sera signé."
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Aucun secret de signature (MIBEM_RELEASE_KEYSTORE_BASE64) — l'APK release ne sera pas signé pour cette build."
          fi

      - name: Compiler l'APK release (signé si les secrets sont présents)
        env:
          MIBEM_RELEASE_KEYSTORE: ${{ runner.temp }}/mibem-release.jks
          MIBEM_RELEASE_STORE_PASSWORD: ${{ secrets.MIBEM_RELEASE_STORE_PASSWORD }}
          MIBEM_RELEASE_KEY_ALIAS: ${{ secrets.MIBEM_RELEASE_KEY_ALIAS }}
          MIBEM_RELEASE_KEY_PASSWORD: ${{ secrets.MIBEM_RELEASE_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Compiler aussi l'APK de débogage (toujours disponible, pour les tests)
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Compiler le bundle AAB de production (pour publication Play Store)
        env:
          MIBEM_RELEASE_KEYSTORE: ${{ runner.temp }}/mibem-release.jks
          MIBEM_RELEASE_STORE_PASSWORD: ${{ secrets.MIBEM_RELEASE_STORE_PASSWORD }}
          MIBEM_RELEASE_KEY_ALIAS: ${{ secrets.MIBEM_RELEASE_KEY_ALIAS }}
          MIBEM_RELEASE_KEY_PASSWORD: ${{ secrets.MIBEM_RELEASE_KEY_PASSWORD }}
        run: cd android && ./gradlew bundleRelease --no-daemon
        continue-on-error: true

      - name: Publier l'APK release signé comme fichier téléchargeable (onglet Actions)
        uses: actions/upload-artifact@v4
        if: steps.signing.outputs.has_signing == 'true'
        with:
          name: MIBEM-QHSE-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Publier l'APK de débogage comme fichier téléchargeable (tests uniquement)
        uses: actions/upload-artifact@v4
        with:
          name: MIBEM-QHSE-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: Publier le bundle AAB (si généré avec succès)
        uses: actions/upload-artifact@v4
        if: hashFiles('android/app/build/outputs/bundle/release/*.aab') != ''
        with:
          name: MIBEM-QHSE-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 90
