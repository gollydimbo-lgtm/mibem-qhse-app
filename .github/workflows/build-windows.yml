name: Build Windows EXE (MIBEM QHSE)

on:
  workflow_run:
    workflows: ["Build Android APK (MIBEM QHSE)"]
    types: [completed]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      actions: read
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Lire le numéro de version
        id: version
        shell: bash
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Injecter le numéro de version dans l'application
        shell: bash
        run: sed -i "s/__APP_VERSION__/${{ steps.version.outputs.value }}/g" www/index.html

      - name: Créer le tag Git de version (si absent)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v${{ steps.version.outputs.value }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Le tag $TAG existe déjà sur le dépôt distant — rien à faire."
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Tag $TAG créé et poussé."
          fi

      - name: Synchroniser le contenu web vers l'application Windows
        shell: bash
        run: cp www/index.html electron-app/app/index.html

      - name: Aligner le numéro de version de l'application Windows
        shell: bash
        run: |
          cd electron-app
          npm version ${{ steps.version.outputs.value }} --no-git-tag-version --allow-same-version

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dépendances npm (application Windows)
        working-directory: electron-app
        run: npm install

      - name: Compiler l'exécutable Windows (sans publication automatique)
        working-directory: electron-app
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Récupérer l'APK Android compilé par l'autre workflow
        uses: actions/download-artifact@v4
        with:
          name: MIBEM-QHSE-debug-apk
          path: android-apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Publier la release GitHub avec tous les fichiers (Windows + Android)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: MIBEM QHSE v${{ steps.version.outputs.value }}
          make_latest: true
          files: |
            electron-app/dist_electron/*.exe
            electron-app/dist_electron/*.blockmap
            electron-app/dist_electron/latest.yml
            android-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier aussi les fichiers comme artefacts (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: MIBEM-QHSE-Windows
          path: |
            electron-app/dist_electron/*.exe
          retention-days: 90
